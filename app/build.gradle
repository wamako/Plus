plugins {
    id 'com.android.application'
}

def buildVersions = new groovy.json.JsonSlurper().parse(rootProject.file('build-versions.json'))

def nativeAbi = providers.gradleProperty('spotifyplusNativeAbi').getOrElse('arm64-v8a')
if (!(nativeAbi in ['arm64-v8a', 'x86_64'])) throw new GradleException('Unsupported Spotify Plus native ABI')

android {
    namespace 'com.lenerd46.spotifyplus'
    compileSdk 35

    def keystorePath = System.getenv("SIGNING_KEYSTORE_FILE")

    defaultConfig {
        applicationId "com.lenerd46.spotifyplus"
        minSdk 27
        targetSdk 35
        versionCode buildVersions.moduleVersionCode
        versionName (buildVersions.moduleVersion + (nativeAbi == 'x86_64' ? '-emulator-x86_64' : ''))

        buildConfigField "int", "SHUFFLE_HOST", buildVersions.host.toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters nativeAbi }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; targets 'native-lib', 'spotifyplus_bridge' } }
    }

    signingConfigs {
        release {
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig true }
    ndkVersion '26.3.11579264'
    externalNativeBuild { cmake { path file('api2-source/app/src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main { java.srcDir 'api2-generated/java'; assets.srcDir 'api2-assets'; jniLibs.srcDir 'api2-source/app/libnode/bin' } }
    packaging { jniLibs {
        pickFirsts += ['**/libc++_shared.so', '**/libnode.so']
        if (nativeAbi == 'x86_64') keepDebugSymbols += ['**/libnode.so']
    } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation 'com.facebook.yoga:yoga:3.2.1'
    implementation 'com.facebook.soloader:soloader:0.12.1'
    implementation 'com.facebook.fbjni:fbjni-java-only:0.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'com.faendir.rhino:rhino-android:1.6.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.github.pemistahl:lingua:1.2.2'
    implementation 'com.mikhaellopez:circleview:1.4.1'
    implementation 'org.luckypray:dexkit:2.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'org.jsoup:jsoup:1.21.2'
//    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
//    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}

// Each variant owns its generated assets and its matching compiled addon.
// Mixed Debug/Release builds must never copy each other's native output.
['debug', 'release'].each { variant ->
    def capitalized = variant.capitalize()
    def output = layout.buildDirectory.dir("generated/api2Addon/${variant}")
    def sync = tasks.register("sync${capitalized}Api2Addon", Sync) {
        dependsOn "externalNativeBuild${capitalized}"
        def addon = fileTree(layout.buildDirectory.dir("intermediates/cmake/${variant}")) {
            include "**/obj/${nativeAbi}/libspotifyplus_bridge.so"
        }
        from(addon) { eachFile { path = "nodejs/addons/${nativeAbi}/spotifyplus_bridge.node" }; includeEmptyDirs = false }
        into output
        doFirst {
            if (addon.files.size() != 1) throw new GradleException("Expected one ${variant} API-2 addon, found " + addon.files)
        }
    }
    // A task-backed source directory carries the producer dependency to every
    // consumer, including lint, rather than only to mergeAssets.
    android.sourceSets.getByName(variant).assets.srcDir(sync)
    tasks.matching { it.name == "merge${capitalized}Assets" }.configureEach { dependsOn sync }
}
