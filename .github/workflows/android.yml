name: Build Spotify Plus APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Upstream moved to GitLab without the old release binaries. Keep the
      # verified R11 runtime/lyrics binary inputs; all host code is rebuilt.
      - name: Restore verified binary inputs
        uses: actions/cache@v4
        id: binary-inputs
        with:
          path: .api2-cache/r11
          key: spotifyplus-r11-176aac1fec257cf18b7f2fc002f5cad2be2f9cc774a69694094e34555abb5df2

      - name: Download retained R11 build inputs
        if: steps.binary-inputs.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: SpotifyPlus-Debug-APK
          run-id: 42078701459
          github-token: ${{ github.token }}
          path: .api2-cache/r11

      - name: Prepare and test pinned API-2 runtime and extensions
        run: python3 tools/prepare_api2.py --runtime-apk .api2-cache/r11/app-debug.apk

      - name: Test and build installable debug APK
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          bash ./gradlew clean testDebugUnitTest assembleDebug

      - name: Validate module DEX files
        run: |
          python3 tools/verify_module_apk.py app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_api2_assets.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/spotifyplus-release.jks"

      - name: Build signed Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spotifyplus-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          bash ./gradlew assembleRelease
          python3 tools/verify_module_apk.py app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
