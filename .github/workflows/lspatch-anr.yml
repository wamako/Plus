name: Diagnose patched startup with an immutable module fixture
on:
  pull_request:
    paths:
      - 'tools/lspatch_anr.py'
      - 'tools/test_lspatch_anr.py'
      - 'tools/run_lspatch_smoke.py'
      - '.github/workflows/lspatch-anr.yml'
      - '.github/workflows/s24-validation.yml'
permissions:
  contents: read
  actions: read
jobs:
  check-anr-parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m unittest discover -s tools -p test_lspatch_anr.py
          python3 -m unittest discover -s tools -p test_lspatch_guest_capacity.py
  inspect-main-thread:
    strategy:
      fail-fast: false
      matrix:
        sample: [a, b]
    needs: check-anr-parser
    if: >-
      vars.RUN_LSPATCH_SMOKE == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/s24-validation.yml
    with:
      emulator_cores: 4
      emulator_ram_mb: 4096
      report_tag: '-${{ matrix.sample }}'
      native_x86: true
      signature_bypass_level: '2'
      run_patched_host: true
      module_run_id: '42325870725'
      module_source_commit: 'dfdf6d3ac6e725fed595b7e95556a39024e90279'
    secrets:
      SPOTIFY_APK_URL: ${{ secrets.SPOTIFY_APK_URL }}
  compare-module-inputs:
    if: >-
      vars.RUN_LSPATCH_SMOKE == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: SpotifyPlus-Emulator-x86_64-APK
          run-id: 42324266946
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixture-old
      - uses: actions/download-artifact@v4
        with:
          name: SpotifyPlus-Emulator-x86_64-APK
          run-id: 42325870725
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixture-new
      - name: Compare immutable module entry bytes without exposing contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          def entries(path):
              with zipfile.ZipFile(path) as apk:
                  result = {}
                  for item in apk.infolist():
                      if item.is_dir():
                          continue
                      with apk.open(item) as stream:
                          sha = hashlib.file_digest(stream, "sha256").hexdigest()
                      result[item.filename] = {"sha256": sha, "bytes": item.file_size}
                  return result
          before = entries(root / "fixture-old/app-debug.apk")
          after = entries(root / "fixture-new/app-debug.apk")
          changed = [name for name in sorted(set(before) | set(after)) if before.get(name) != after.get(name)]
          report = {"test_kind": "module_fixture_entry_comparison", "before_run": 42324266946,
                    "after_run": 42325870725, "before_entries": len(before), "after_entries": len(after),
                    "changed_count": len(changed),
                    "changed": [{"entry": name if re.fullmatch(r"[A-Za-z0-9_./$+\-]{1,220}", name) else "other_entry",
                                 "before": before.get(name), "after": after.get(name)} for name in changed[:100]]}
          print("MODULE_COMPARISON " + json.dumps(report, sort_keys=True))
          PY
      - name: Remove module fixtures
        if: always()
        run: rm -rf "$RUNNER_TEMP/fixture-old" "$RUNNER_TEMP/fixture-new"
