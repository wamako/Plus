plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lenerd46.spotifyplus'
    compileSdk 35

    def keystorePath = System.getenv("SIGNING_KEYSTORE_FILE")

    defaultConfig {
        applicationId "com.lenerd46.spotifyplus"
        minSdk 27
        targetSdk 35
        versionCode 29
        versionName "0.10.0-api2.9.1.94.12"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; targets 'native-lib', 'spotifyplus_bridge' } }
    }

    signingConfigs {
        release {
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig true }
    ndkVersion '26.3.11579264'
    externalNativeBuild { cmake { path file('api2-source/app/src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main { java.srcDir 'api2-generated/java'; assets.srcDir 'api2-assets'; jniLibs.srcDir 'api2-source/app/libnode/bin' } }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so', '**/libnode.so'] } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation 'com.facebook.yoga:yoga:3.2.1'
    implementation 'com.facebook.soloader:soloader:0.12.1'
    implementation 'com.facebook.fbjni:fbjni-java-only:0.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'com.faendir.rhino:rhino-android:1.6.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.github.pemistahl:lingua:1.2.2'
    implementation 'com.mikhaellopez:circleview:1.4.1'
    implementation 'org.luckypray:dexkit:2.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'org.jsoup:jsoup:1.21.2'
//    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
//    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}

// The API-2 Node addon is a freshly compiled native library, not a downloaded addon.
tasks.register('syncApi2Addon') {
    dependsOn 'externalNativeBuildDebug'
    doLast {
        def matches = fileTree("$buildDir/intermediates/cmake").matching { include '**/obj/arm64-v8a/libspotifyplus_bridge.so' }.files
        if (matches.size() != 1) throw new GradleException("Expected one compiled API-2 addon, found " + matches)
        copy { from matches.first(); into 'api2-assets/nodejs/addons/arm64-v8a'; rename { 'spotifyplus_bridge.node' } }
    }
}
tasks.matching { it.name == 'mergeDebugAssets' || it.name == 'mergeReleaseAssets' }.configureEach { dependsOn 'syncApi2Addon' }
