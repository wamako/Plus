name: LSPatch Android 17 ARM64 validation

# Adapted from wamako/android-ci-template at 7d1ca34a8d3b25c9a8049dc2c876817190845a83.
# The caller builds/prepares Plus once, then supplies artifacts from this run.
on:
  workflow_call:
    secrets:
      SPOTIFY_APK_URL:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  patched-host-startup:
    # macos-14 is Intel. macos-15 is the standard Apple Silicon runner.
    # Assert this below so a runner-label change cannot silently change the test.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Require native ARM host
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator'

      - name: Require the exact API 37 ARM64 image
        shell: bash
        run: |
          sdkmanager --list > "$RUNNER_TEMP/sdk-packages.txt"
          if ! grep -F 'system-images;android-37;google_apis;arm64-v8a' "$RUNNER_TEMP/sdk-packages.txt"; then
            echo '::error::API 37 google_apis ARM64 image is unavailable. No lower API or x86 fallback was tested.'
            exit 1
          fi

      - name: Download prepared and verified Plus module from caller
        uses: actions/download-artifact@v4
        with:
          name: SpotifyPlus-Debug-APK
          path: ${{ runner.temp }}/plus-module

      - name: Download the separately built Shuffle+ extension
        uses: actions/download-artifact@v4
        with:
          name: SpotifyPlus-ShufflePlus-0.1.0
          path: ${{ runner.temp }}/shuffle-extension

      - name: Install manifest inspection dependency
        run: python3 -m pip install androguard==4.1.4

      - name: Patch the original Spotify and verify embedded files and signature
        env:
          SPOTIFY_APK_URL: ${{ secrets.SPOTIFY_APK_URL }}
        run: >-
          python3 tools/prepare_lspatch_smoke.py
          --module "$RUNNER_TEMP/plus-module/app-debug.apk"
          --work "$RUNNER_TEMP/lspatch-smoke"
          --report "$RUNNER_TEMP/smoke-reports/package.json"

      - name: Boot Android 17 ARM64 and exercise the patched Spotify process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: arm64-v8a
          avd-name: spotifyplus-api37
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: >-
            python3 tools/run_lspatch_smoke.py
            --apk "$RUNNER_TEMP/lspatch-smoke/spotify-lspatched.apk"
            --extension "$RUNNER_TEMP/shuffle-extension/shuffle-plus"
            --report "$RUNNER_TEMP/smoke-reports/startup.json"

      # APKs, raw logcat, private source URLs and app data are never artifacts.
      - name: Upload only structured validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LSPatch-Android17-ARM64-Reports
          path: ${{ runner.temp }}/smoke-reports/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Explain scope in run summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          LSPatch validation targets Android 17/API 37, ARM64, integrated LSPatch 1.2 (487), Xposed API 102 and Vector canary-3106.

          Inspect this job's result and JSON reports for packaging and startup outcomes. A setup failure or missing report is not a runtime pass.

          The device test requires two app starts, the Plus entry point, Node host readiness, Shuffle+ script loading, native mappings and read-only extracted code. It uses a fresh, logged-out generic AVD. App launches run with ADB unrooted; root ADB is used only for fixture setup and inspection.

          It does not test Samsung firmware, account login, extension UI clicks, music playback or actual queue order. Build/JVM/JS tests are separate checks.
          EOF

      - name: Remove private test inputs
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/lspatch-smoke" "$RUNNER_TEMP/plus-module" "$RUNNER_TEMP/shuffle-extension"
