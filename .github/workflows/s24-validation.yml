name: LSPatch Android 17 Linux validation

# Linux/KVM guest; ARM64 app code uses the Google image's native bridge.
# This is translated ARM coverage, not a Samsung/native-ARM device result.
on:
  workflow_call:
    inputs:
      run_patched_host:
        type: boolean
        default: false
    secrets:
      SPOTIFY_APK_URL:
        required: false
    outputs:
      environment_result:
        description: 'booted or setup_failed; separate from patched-app startup'
        value: ${{ jobs.android17-validation.outputs.environment_result }}

permissions:
  contents: read
  actions: read

jobs:
  android17-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPOTIFYPLUS_EMULATION_MODE: kvm-arm64-translation
      DEVICE_PROFILE: linux-x86_64-arm64-translation
    outputs:
      environment_result: ${{ steps.scope.outputs.environment_result }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Linux x86_64 and enable this job's KVM access
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up official Linux Android SDK
        run: python3 tools/setup_android37_sdk.py
      - name: Require usable KVM and the exact stable API 37 x86_64 image
        run: |
          emulator -accel-check
          python3 tools/check_android37_image.py --abi x86_64
      - name: Download same-run Plus module
        if: inputs.run_patched_host
        uses: actions/download-artifact@v4
        with:
          name: SpotifyPlus-Debug-APK
          path: ${{ runner.temp }}/plus-module
      - name: Download same-run Shuffle+ extension
        if: inputs.run_patched_host
        uses: actions/download-artifact@v4
        with:
          name: SpotifyPlus-ShufflePlus-0.1.0
          path: ${{ runner.temp }}/shuffle-extension
      - name: Install APK inspection dependency
        if: inputs.run_patched_host
        run: python3 -m pip install androguard==4.1.4
      - name: Verify original source, integrated patch and APK signature
        if: inputs.run_patched_host
        env:
          SPOTIFY_APK_URL: ${{ secrets.SPOTIFY_APK_URL }}
        run: >-
          python3 tools/prepare_lspatch_smoke.py
          --module "$RUNNER_TEMP/plus-module/app-debug.apk"
          --work "$RUNNER_TEMP/lspatch-smoke"
          --report "$RUNNER_TEMP/smoke-reports/package.json"
      - name: Boot API 37 with KVM and verify ARM64 translation
        id: boot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          avd-name: spotifyplus-api37-linux
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data -accel on -cores 2
          script: |
            python3 tools/run_lspatch_smoke.py --device-profile "$DEVICE_PROFILE" --check-environment --report "$RUNNER_TEMP/smoke-reports/environment.json"
            if [ "${{ inputs.run_patched_host }}" = true ]; then
              python3 tools/run_lspatch_smoke.py --device-profile "$DEVICE_PROFILE" --apk "$RUNNER_TEMP/lspatch-smoke/spotify-lspatched.apk" --extension "$RUNNER_TEMP/shuffle-extension/shuffle-plus" --report "$RUNNER_TEMP/smoke-reports/startup.json" --timeout 360
            fi
      - name: Record actual guest and translation evidence
        id: scope
        if: always()
        env:
          BOOT_MODE: kvm-arm64-translation
          BOOT_RESULT: ${{ steps.boot.outcome }}
        run: python3 tools/report_android37_scope.py
      - name: Upload structured reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_patched_host && 'LSPatch-Android17-Linux-Reports' || 'Android17-Linux-Environment-Report' }}
          path: ${{ runner.temp }}/smoke-reports/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Explain coverage
        if: always()
        run: |
          echo 'Linux/KVM runs an API 37 x86_64 Google APIs guest. The test requires its ARM64 native bridge and installs Spotify with --abi arm64-v8a. This is translated ARM coverage, not native ARM/Samsung firmware coverage.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Guest environment, original APK/package verification and actual Spotify startup are separate checks. No account/playback/UI result is inferred from a guest boot.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private test inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/lspatch-smoke" "$RUNNER_TEMP/plus-module" "$RUNNER_TEMP/shuffle-extension"
